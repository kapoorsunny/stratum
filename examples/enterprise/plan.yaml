# A worked example at enterprise shape. Sixteen compartments, seven families,
# twelve principals, and people who belong to several departments plus a
# project at once.
#
# Everything here is public Wikipedia material, so anyone can run it and get
# the same corpus. Swap the urls for folders pointing at your own share drive
# and the rest of the pipeline does not change.
#
#   stratum corpus plan check --plan examples/enterprise/plan.yaml
#   stratum corpus plan build --plan examples/enterprise/plan.yaml --out work/corpus
#
# tier says where material is allowed to live.
#   company     everyone reads it, so it may enter shared weights
#   department  a group reads it, so it gets an adapter of its own
#   restricted  index only, it never enters any weights
#
# family says which adapter carries a compartment's language. Compartments
# that are written alike share one, which is what keeps the number of
# adapters a single person loads down near three, where merging still works.

compartments:

  # --- everyone ---------------------------------------------------------
  public:
    tier: company
    family: general
    description: Policy and governance that every employee may read
    urls:
      - https://en.wikipedia.org/api/rest_v1/page/html/Business_ethics
      - https://en.wikipedia.org/api/rest_v1/page/html/Code_of_conduct
      - https://en.wikipedia.org/api/rest_v1/page/html/Corporate_governance
      - https://en.wikipedia.org/api/rest_v1/page/html/Internal_control
      - https://en.wikipedia.org/api/rest_v1/page/html/Regulatory_compliance
      - https://en.wikipedia.org/api/rest_v1/page/html/Risk_management
      - https://en.wikipedia.org/api/rest_v1/page/html/Standard_operating_procedure

  # --- family: technical ------------------------------------------------
  engineering:
    tier: department
    family: technical
    description: Rotating equipment and process plant
    urls:
      - https://en.wikipedia.org/api/rest_v1/page/html/Boiler
      - https://en.wikipedia.org/api/rest_v1/page/html/Centrifugal_compressor
