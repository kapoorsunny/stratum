  # --- family: people ---------------------------------------------------
  hr:
    tier: department
    family: people
    description: Hiring, benefits and workplace health
    urls:
      - https://en.wikipedia.org/api/rest_v1/page/html/Employee_benefits
      - https://en.wikipedia.org/api/rest_v1/page/html/Human_resource_management
