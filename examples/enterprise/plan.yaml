  treasury:
    tier: department
    family: finance
    description: Cash, funding and financial risk
    urls:
      - https://en.wikipedia.org/api/rest_v1/page/html/Cash_flow
      - https://en.wikipedia.org/api/rest_v1/page/html/Credit_risk
      - https://en.wikipedia.org/api/rest_v1/page/html/Financial_risk
