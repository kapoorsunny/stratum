  training:
    tier: department
    family: people
    description: Competence, apprenticeships and course material
    urls:
      - https://en.wikipedia.org/api/rest_v1/page/html/Apprenticeship
      - https://en.wikipedia.org/api/rest_v1/page/html/Educational_technology
      - https://en.wikipedia.org/api/rest_v1/page/html/Instructional_design
      - https://en.wikipedia.org/api/rest_v1/page/html/Learning_management_system
      - https://en.wikipedia.org/api/rest_v1/page/html/Professional_development
      - https://en.wikipedia.org/api/rest_v1/page/html/Training
      - https://en.wikipedia.org/api/rest_v1/page/html/Vocational_education

  # --- family: delivery -------------------------------------------------
  # A project is a compartment like any other. People join one on top of
  # their departments, which is the case that pushes an individual past the
  # three adapter limit if the families are cut badly.
  project_atlas:
    tier: department
    family: delivery
    description: Cross functional plant upgrade, membership changes often
    urls:
      - https://en.wikipedia.org/api/rest_v1/page/html/Project_management
      - https://en.wikipedia.org/api/rest_v1/page/html/Feasibility_study
      - https://en.wikipedia.org/api/rest_v1/page/html/Critical_path_method
      - https://en.wikipedia.org/api/rest_v1/page/html/Gantt_chart
      - https://en.wikipedia.org/api/rest_v1/page/html/Work_breakdown_structure
      - https://en.wikipedia.org/api/rest_v1/page/html/Earned_value_management
      - https://en.wikipedia.org/api/rest_v1/page/html/Change_management

  # --- restricted -------------------------------------------------------
  # Named here to show the shape. Restricted material is searchable by the
  # people cleared for it and never enters any adapter, so it can be changed
  # or deleted the moment the source changes. Point it at your own folder.
  # payroll:
  #   tier: restricted
  #   family: people
  #   volatile: true
  #   description: Changes weekly, index only
  #   folders: [raw/payroll]

# Who reads what. Nobody here reads more than five departments plus one
# project, which is the shape a real organisation ends up with.
principals:

  reliability_lead:
    description: Four technical departments plus the upgrade project
    reads: [public, engineering, maintenance, quality, instrumentation, project_atlas]

  plant_manager:
    description: All of operations plus the upgrade project
    reads: [public, logistics, production, facilities, project_atlas]

  counsel:
    reads: [public, legal, procurement, sales]

  controller:
    reads: [public, accounting, treasury]

  hr_lead:
    reads: [public, hr, training]

  site_engineer:
    reads: [public, engineering, maintenance, quality, instrumentation]

  planner:
    reads: [public, logistics, production, facilities]

  buyer:
    reads: [public, legal, procurement, sales, project_atlas]

  trainer:
    reads: [public, hr, training, project_atlas]

  # This one is deliberately awkward. Five departments that cut across two
  # families, so the operations adapter is not usable and logistics reaches
  # this person through the index instead. `plan check` says so rather than
  # quietly handing over an adapter trained on material they cannot read.
  ops_director:
    description: Technical plus one operations department, cuts across families
    reads: [public, engineering, maintenance, quality, instrumentation, logistics]

  auditor:
    description: Reads widely across finance and commercial
    reads: [public, accounting, treasury, legal]

  contractor:
    description: Outside the company, sees only what everyone sees
    reads: [public]

# Public sites refuse a fast run and answer with 429, which loses most of
# the download while still looking like it worked. Half a second is enough.
# This has nothing to do with a corpus that comes off your own share drive.
fetch:
  pause: 0.5
