      - https://en.wikipedia.org/api/rest_v1/page/html/Bill_of_materials
      - https://en.wikipedia.org/api/rest_v1/page/html/Capacity_planning
      - https://en.wikipedia.org/api/rest_v1/page/html/Just-in-time_manufacturing
      - https://en.wikipedia.org/api/rest_v1/page/html/Lean_manufacturing
      - https://en.wikipedia.org/api/rest_v1/page/html/Manufacturing
