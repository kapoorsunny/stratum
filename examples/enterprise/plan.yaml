      - https://en.wikipedia.org/api/rest_v1/page/html/Heat_exchanger
      - https://en.wikipedia.org/api/rest_v1/page/html/Pressure_vessel
      - https://en.wikipedia.org/api/rest_v1/page/html/Steam_turbine

  maintenance:
    tier: department
    family: technical
    description: Inspection, repair and reliability
    urls:
