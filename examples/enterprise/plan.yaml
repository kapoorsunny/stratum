      - https://en.wikipedia.org/api/rest_v1/page/html/Contract
      - https://en.wikipedia.org/api/rest_v1/page/html/Force_majeure
      - https://en.wikipedia.org/api/rest_v1/page/html/Indemnity
      - https://en.wikipedia.org/api/rest_v1/page/html/Intellectual_property
      - https://en.wikipedia.org/api/rest_v1/page/html/Legal_liability
