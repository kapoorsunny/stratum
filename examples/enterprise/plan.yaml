      - https://en.wikipedia.org/api/rest_v1/page/html/E-procurement
      - https://en.wikipedia.org/api/rest_v1/page/html/Procurement
      - https://en.wikipedia.org/api/rest_v1/page/html/Request_for_proposal
      - https://en.wikipedia.org/api/rest_v1/page/html/Strategic_sourcing
