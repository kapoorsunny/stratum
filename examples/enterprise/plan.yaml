  facilities:
    tier: department
    family: operations
    description: Buildings, utilities and site services
    urls:
      - https://en.wikipedia.org/api/rest_v1/page/html/Building_information_modeling
      - https://en.wikipedia.org/api/rest_v1/page/html/Facility_management
      - https://en.wikipedia.org/api/rest_v1/page/html/Fire_sprinkler_system
      - https://en.wikipedia.org/api/rest_v1/page/html/Heating,_ventilation,_and_air_conditioning
      - https://en.wikipedia.org/api/rest_v1/page/html/Lighting
      - https://en.wikipedia.org/api/rest_v1/page/html/Physical_security
