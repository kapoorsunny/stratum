      - https://en.wikipedia.org/api/rest_v1/page/html/Lubrication
      - https://en.wikipedia.org/api/rest_v1/page/html/Predictive_maintenance
      - https://en.wikipedia.org/api/rest_v1/page/html/Preventive_maintenance
      - https://en.wikipedia.org/api/rest_v1/page/html/Reliability-centered_maintenance
      - https://en.wikipedia.org/api/rest_v1/page/html/Root_cause_analysis
      - https://en.wikipedia.org/api/rest_v1/page/html/Vibration

  quality:
    tier: department
    family: technical
    description: Inspection standards and process control
    urls:
      - https://en.wikipedia.org/api/rest_v1/page/html/Acceptance_sampling
      - https://en.wikipedia.org/api/rest_v1/page/html/ISO_9000_family
      - https://en.wikipedia.org/api/rest_v1/page/html/Quality_management_system
      - https://en.wikipedia.org/api/rest_v1/page/html/Six_Sigma
      - https://en.wikipedia.org/api/rest_v1/page/html/Statistical_process_control

  instrumentation:
    tier: department
    family: technical
    description: Control systems, sensors and field devices
    urls:
      - https://en.wikipedia.org/api/rest_v1/page/html/Control_valve
      - https://en.wikipedia.org/api/rest_v1/page/html/Distributed_control_system
      - https://en.wikipedia.org/api/rest_v1/page/html/Instrumentation
      - https://en.wikipedia.org/api/rest_v1/page/html/Pressure_measurement
      - https://en.wikipedia.org/api/rest_v1/page/html/Programmable_logic_controller
