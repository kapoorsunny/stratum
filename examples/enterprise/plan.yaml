  # --- family: finance --------------------------------------------------
  accounting:
    tier: department
    family: finance
    description: Ledgers, reporting and audit
    urls:
      - https://en.wikipedia.org/api/rest_v1/page/html/Accounts_payable
      - https://en.wikipedia.org/api/rest_v1/page/html/Audit
      - https://en.wikipedia.org/api/rest_v1/page/html/Balance_sheet
      - https://en.wikipedia.org/api/rest_v1/page/html/Depreciation
