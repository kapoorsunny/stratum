      - https://en.wikipedia.org/api/rest_v1/page/html/Customer_relationship_management
      - https://en.wikipedia.org/api/rest_v1/page/html/Market_segmentation
      - https://en.wikipedia.org/api/rest_v1/page/html/Pricing
      - https://en.wikipedia.org/api/rest_v1/page/html/Pricing_strategies
